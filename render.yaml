services:
  - type: web
    name: controlplane
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/main.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_GUARD_KEY
        sync: false
      - key: LOGFIRE_TOKEN
        sync: false
